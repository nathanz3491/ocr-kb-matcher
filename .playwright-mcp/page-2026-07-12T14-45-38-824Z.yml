              - text: ：我们不使用 Google Analytics、Facebook Pixel 等第三方追踪工具。
          - paragraph [ref=f2e145]: 您可以通过浏览器设置清除 Cookie 或拒绝 Cookie，但可能导致部分功能（如保持登录）无法正常使用。
          - paragraph [ref=f2e146]: We use essential cookies for authentication and theme preferences, plus self-hosted anonymous analytics. We do not use third-party trackers like Google Analytics or Facebook Pixel. Disabling cookies may affect login persistence.
